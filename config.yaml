home_assistant:
  url: ${HA_URL}
  token: ${HA_TOKEN}
devices:
  - name: quad_cortex
    match: Quad Cortex
    enabled: true
  - name: nanokey2_keyboard
    match: nanoKEY2 KEYBOARD
presets:
  natural_light:
    - name: cool daylight
      kelvin: 6500
    - name: daylight
      kelvin: 5500
    - name: neutral
      kelvin: 4000
    - name: warm white
      kelvin: 3000
    - name: candlelight
      kelvin: 2200
  warm_colors:
    - name: deep amber
      rgb:
        - 255
        - 100
        - 0
    - name: red
      rgb:
        - 255
        - 0
        - 0
  brightness:
    - percent: 25
      label: dim
    - percent: 50
    - percent: 75
    - percent: 100
      label: full
mappings:
  quad_cortex:
    - match:
        type: control_change
        channel: 0
        control: 0
      action: ha_toggle
      params:
        entity_id: light.lights
    - match:
        type: control_change
        channel: 0
        control: 1
      action: ha_color_temp
      cycle: true
      params:
        entity_id: light.lights
        presets: $natural_light
    - match:
        type: control_change
        channel: 0
        control: 2
      action: ha_color
      cycle: true
      params:
        entity_id: light.lights
        presets: $warm_colors
    - match:
        type: control_change
        channel: 0
        control: 3
      action: ha_brightness
      cycle: true
      params:
        entity_id: light.lights
        presets: $brightness
    - match:
        type: control_change
        channel: 0
        control: 9
      action: shell
      params:
        command: nowplaying-cli togglePlayPause
  nanokey2_keyboard:
    - match:
        type: note_on
        note: 48
      action: ha_toggle
      params:
        entity_id: light.lights
    - match:
        type: note_on
        note: 49
      action: ha_color_temp
      cycle: true
      params:
        entity_id: light.lights
        presets: $natural_light
    - match:
        type: note_on
        note: 51
      action: ha_color
      cycle: true
      params:
        entity_id: light.lights
        presets: $warm_colors
    - match:
        type: note_on
        note: 50
      action: ha_brightness
      cycle: true
      params:
        entity_id: light.lights
        presets: $brightness
    - match:
        type: note_on
        note: 54
      action: ha_fan_speed
      params:
        entity_id: fan.blue_pure_fan
        percent: 33
    - match:
        type: note_on
        note: 56
      action: ha_fan_speed
      params:
        entity_id: fan.blue_pure_fan
        percent: 66
    - match:
        type: note_on
        note: 58
      action: ha_fan_speed
      params:
        entity_id: fan.blue_pure_fan
        percent: 100
